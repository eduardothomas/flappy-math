<title>Flappy Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=Pixelify+Sans:wght@500;700&family=Fredoka:wght@600;700&display=swap">
<style>
/* Layout: un escenario 9:16 escalado al viewport; pizarra de aula con lápices como obstáculos.
   Tema único deliberado (pizarra oscura), con todos los colores explícitos. */
:root {
  --board: #1e3a33;
  --board-deep: #142a25;
  --chalk: #eef0e2;
  --chalk-dim: #b9c4b5;
  --pencil: #f2c230;
  --pencil-deep: #c9971a;
  --paper: #f7f1de;
  --ink: #1b2622;
  --eraser: #e7899a;
  --wood: #8a5a34;
  --ok: #7fd18b;
  --bad: #ff8a7a;
  --font-display: "Pixelify Sans", "Courier New", monospace;
  --font-digits: "Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--board-deep);
  color: var(--chalk);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app { height: 100%; display: flex; align-items: center; justify-content: center; }
#stage {
  position: relative; width: 360px; height: 640px; --s: 1;
  background: var(--board); overflow: hidden; touch-action: none;
  box-shadow: 0 0 0 calc(var(--s) * 6px) var(--wood), 0 20px 60px rgba(0,0,0,.45);
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.screen {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  font-size: calc(var(--s) * 15px); padding: calc(var(--s) * 20px);
  text-align: center;
}
.screen.dim { background: rgba(14, 30, 26, .72); justify-content: center; }

.logo { margin-top: calc(var(--s) * 22px); line-height: .9; font-family: var(--font-display); }
.logo .l1 { font-size: calc(var(--s) * 54px); color: var(--chalk); letter-spacing: .02em; text-shadow: 0 calc(var(--s)*4px) 0 var(--board-deep); }
.logo .l2 { font-size: calc(var(--s) * 62px); color: var(--pencil); letter-spacing: .04em; text-shadow: 0 calc(var(--s)*4px) 0 var(--pencil-deep); }
.logo .eq { font-family: var(--font-num); font-size: calc(var(--s) * 15px); color: var(--chalk-dim); margin-top: calc(var(--s) * 10px); letter-spacing: .08em; }

.menu-bottom { margin-top: auto; margin-bottom: calc(var(--s) * 54px); width: 100%; display: flex; flex-direction: column; gap: calc(var(--s) * 12px); align-items: center; }
.hint { color: var(--chalk-dim); font-size: calc(var(--s) * 13px); max-width: 26em; line-height: 1.4; text-wrap: balance; }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--s) * 6px); width: 100%; }
.seg button {
  font: 600 calc(var(--s) * 14px)/1.1 var(--font-body); color: var(--chalk);
  background: transparent; border: calc(var(--s) * 2px) dashed rgba(238,240,226,.35);
  border-radius: calc(var(--s) * 8px); padding: calc(var(--s) * 8px) calc(var(--s) * 4px);
  cursor: pointer; display: flex; flex-direction: column; gap: calc(var(--s) * 3px); align-items: center;
}
.seg button small { font: 500 calc(var(--s) * 11px) var(--font-num); color: var(--chalk-dim); font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { border-style: solid; border-color: var(--pencil); background: rgba(242,194,48,.12); }
.seg button[aria-pressed="true"]::before { content: "✓ "; color: var(--pencil); }

.btn {
  font: 700 calc(var(--s) * 20px) var(--font-display); letter-spacing: .04em;
  color: var(--ink); background: var(--pencil); border: 0; cursor: pointer;
  border-radius: calc(var(--s) * 6px); padding: calc(var(--s) * 12px) calc(var(--s) * 18px);
  box-shadow: 0 calc(var(--s) * 5px) 0 var(--pencil-deep); width: 100%;
  transition: transform .06s;
}
.btn:active { transform: translateY(calc(var(--s) * 3px)); box-shadow: 0 calc(var(--s) * 2px) 0 var(--pencil-deep); }
.btn.ghost { background: transparent; color: var(--chalk); box-shadow: none; border: calc(var(--s) * 2px) solid rgba(238,240,226,.45); font-size: calc(var(--s) * 16px); padding-block: calc(var(--s) * 9px); }
.row { display: flex; gap: calc(var(--s) * 10px); width: 100%; }
.row > * { flex: 1; min-width: 0; }
.play-row #playBtn { flex: 1.6; }
.play-row #settingsBtn { padding-inline: calc(var(--s) * 6px); }
button:focus-visible { outline: calc(var(--s) * 3px) solid var(--chalk); outline-offset: calc(var(--s) * 3px); }

.card {
  background: var(--paper); color: var(--ink); width: 100%;
  border-radius: calc(var(--s) * 4px); padding: calc(var(--s) * 18px);
  display: flex; flex-direction: column; gap: calc(var(--s) * 12px); align-items: center;
  box-shadow: 0 calc(var(--s) * 10px) calc(var(--s) * 30px) rgba(0,0,0,.35);
  background-image: repeating-linear-gradient(transparent 0 calc(var(--s) * 23px), rgba(60,110,160,.18) calc(var(--s) * 23px) calc(var(--s) * 24px));
}
.card h2 { margin: 0; font: 700 calc(var(--s) * 26px) var(--font-display); color: var(--ink); }
.card .btn.ghost { color: var(--ink); border-color: rgba(27,38,34,.4); }
.cause { font-size: calc(var(--s) * 14px); line-height: 1.4; color: #4a5a54; text-wrap: balance; }
.cause b { font-family: var(--font-num); color: var(--ink); }
.scores { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--s) * 10px); width: 100%; }
.scores div { display: flex; flex-direction: column; gap: calc(var(--s) * 2px); }
.scores span { font-size: calc(var(--s) * 11px); text-transform: uppercase; letter-spacing: .12em; color: #5b6a64; }
.scores strong { font: 700 calc(var(--s) * 44px)/1 var(--font-digits); font-variant-numeric: tabular-nums; }
.badge { font: 700 calc(var(--s) * 13px) var(--font-body); background: var(--ink); color: var(--pencil); padding: calc(var(--s) * 4px) calc(var(--s) * 10px); border-radius: 999px; letter-spacing: .06em; }
.seed { font: 500 calc(var(--s) * 10px) var(--font-num); color: #7d8a84; }

.toggles { display: flex; flex-direction: column; gap: calc(var(--s) * 8px); width: 100%; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: calc(var(--s) * 10px);
  font: 600 calc(var(--s) * 15px) var(--font-body); color: var(--ink); background: transparent; cursor: pointer;
  border: 0; border-bottom: 1px solid rgba(27,38,34,.15); padding: calc(var(--s) * 8px) 0; width: 100%; text-align: left; }
.toggle em { font: 700 calc(var(--s) * 13px) var(--font-num); font-style: normal; min-width: 3.5em; text-align: center;
  padding: calc(var(--s) * 3px) calc(var(--s) * 8px); border-radius: calc(var(--s) * 4px); border: calc(var(--s) * 2px) solid var(--ink); }
.toggle[aria-pressed="true"] em { background: var(--ink); color: var(--pencil); }

#pauseBtn {
  position: absolute; top: calc(var(--s) * 14px); right: calc(var(--s) * 12px);
  width: calc(var(--s) * 40px); height: calc(var(--s) * 40px);
  border-radius: calc(var(--s) * 8px); border: calc(var(--s) * 2px) solid rgba(238,240,226,.5);
  background: rgba(20,42,37,.6); color: var(--chalk); cursor: pointer;
  font: 700 calc(var(--s) * 16px) var(--font-num); display: grid; place-items: center;
}
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>

<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <button id="pauseBtn" hidden aria-label="Pausa">❚❚</button>

    <section id="menu" class="screen">
      <div class="logo" aria-label="Flappy Math">
        <div class="l1">FLAPPY</div>
        <div class="l2">MATH</div>

      </div>
      <div class="menu-bottom">
        <p class="hint" id="tHint"></p>
        <div class="seg" role="group" id="diffSeg">
          <button id="dEasy" data-d="easy"><span></span><small></small></button>
          <button id="dNormal" data-d="normal"><span></span><small></small></button>
          <button id="dHard" data-d="hard"><span></span><small></small></button>

    <section id="pause" class="screen dim" hidden>
      <div class="card">

        </div>
        <button class="btn" id="settingsBack"></button>
      </div>
    </section>
  </div>
</div>

<script>
/* Flappy Math — núcleo independiente del renderizado.
   Contiene: RNG con semilla, expresiones (AST + evaluación entera propia),
   generador de desafíos, geometría de obstáculos con validador de alcanzabilidad
   y simulación de partida a paso fijo. Sin dependencias del DOM. */
(function (root) {
  'use strict';

  // ---------- Constantes del mundo (unidades lógicas 360×640) ----------
  const W = 360, H = 640, GROUND = 584;
  const PHYS = { gravity: 900, flap: -300, maxFall: 450, baseSpeed: 140, dt: 1 / 60 };
  const BIRD = { x: 96, hw: 11, hh: 8 };            // hitbox 22×16, menor que el sprite
  const OBST = { w: 72, wall: 64, hudBottom: 112, groundPad: 14 };
  const REACH = { climb: 150, margin: 24 };         // presupuesto conservador de ascenso (u/s)

  const DIFFS = {
    easy: {
      key: 'easy', lane: 134, weights: { add: 1, sub: 1 }, addMax: 9, subMax: 9, literalMax: 9,
      speedCap: 1.25, spacingStart: 4.4, spacingMin: 3.3, delta: [-2, -1, 1, 2], mixP: 0.3
    },
    normal: {
      key: 'normal', lane: 124, weights: { add: 0.8, sub: 0.8, mul: 1.6 }, addMax: 20, subMax: 20, literalMax: 20,
      speedCap: 1.35, spacingStart: 4.2, spacingMin: 3.1, delta: [-2, -1, 1, 2], mixP: 0.35
    },
    hard: {
      key: 'hard', lane: 114, weights: { add: 0.5, sub: 0.5, mul: 1, div: 1.3, combo: 1.1 }, addMax: 50, subMax: 50, literalMax: 81,
      speedCap: 1.4, spacingStart: 4.0, spacingMin: 3.0, delta: [-3, -2, -1, 1, 2, 3], mixP: 0.3
    }
  };

  // ---------- RNG determinista ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const ri = (r, min, max) => min + Math.floor(r() * (max - min + 1));
  const pick = (r, arr) => arr[Math.floor(r() * arr.length)];

  // ---------- Expresiones ----------
  const N = (v) => ({ k: 'n', v });
  const B = (op, a, b) => ({ k: 'b', op, a, b });

  function evalExpr(e) {
    if (e.k === 'n') return e.v;
    const a = evalExpr(e.a), b = evalExpr(e.b);
    switch (e.op) {
      case '+': return a + b;
      case '-': return a - b;
      case '*': return a * b;
      case '/':
        if (b === 0) throw new Error('div0');
        if (a % b !== 0) throw new Error('inexact');
        return a / b;
    }
    throw new Error('op');
  }

  const SYM = { '+': '+', '-': '−', '*': '×', '/': '÷' };
  const PREC = { '+': 1, '-': 1, '*': 2, '/': 2 };
  function formatExpr(e, parentPrec = 0, isRight = false) {
    if (e.k === 'n') return String(e.v);
    const p = PREC[e.op];
    const s = formatExpr(e.a, p, false) + ' ' + SYM[e.op] + ' ' + formatExpr(e.b, p, true);
    return (p < parentPrec || (isRight && p === parentPrec)) ? '(' + s + ')' : s;
  }

  function literals(e, out = []) {
    if (e.k === 'n') out.push(e.v); else { literals(e.a, out); literals(e.b, out); }
    return out;
  }
  function exprValid(e, c) {
    let v;
    try { v = evalExpr(e); } catch (_) { return false; }
    if (!Number.isInteger(v) || v < 0) return false;
    return literals(e).every((x) => Number.isInteger(x) && x >= 0 && x <= c.literalMax);
  }

  // Expresión correcta por tipo
  const GEN = {
    add(r, c) { const t = ri(r, 1, c.addMax); const a = ri(r, 0, t); return B('+', N(a), N(t - a)); },
    sub(r, c) { const a = ri(r, 1, c.subMax); const b = ri(r, 0, a); return B('-', N(a), N(b)); },
    mul(r) { return B('*', N(ri(r, 2, 9)), N(ri(r, 2, 9))); },
    div(r) { const d = ri(r, 2, 9), q = r() < 0.06 ? 0 : ri(r, 1, 9); return B('/', N(d * q), N(d)); },
    combo(r) {
      const a = ri(r, 2, 6), b = ri(r, 2, 6), k = ri(r, 1, 9);
      const op = (r() < 0.5 || k > a * b) ? '+' : '-';
      return B(op, B('*', N(a), N(b)), N(k));
    }
  };

  // Distractor del mismo tipo: error típico (±1/±2, tabla vecina)
  function perturb(r, e, type, c) {
    const d = pick(r, c.delta), s = d > 0 ? 1 : -1;
    switch (type) {
      case 'add': return r() < 0.5 ? B('+', e.a, N(e.b.v + d)) : B('+', N(e.a.v + d), e.b);
      case 'sub': return r() < 0.5 ? B('-', e.a, N(e.b.v + d)) : B('-', N(e.a.v + d), e.b);
      case 'mul': return r() < 0.5 ? B('*', e.a, N(e.b.v + s)) : B('*', N(e.a.v + s), e.b);
      case 'div': { const D = e.b.v, q = e.a.v / D; return B('/', N(D * (q + d)), N(D)); }
      case 'combo': {
        const m = e.a;
        if (r() < 0.5) return B(e.op, m, N(e.b.v + d));
        return r() < 0.5 ? B(e.op, B('*', N(m.a.v + s), m.b), e.b) : B(e.op, B('*', m.a, N(m.b.v + s)), e.b);
      }
    }
    return null;
  }

  // Expresión de otro tipo con un valor dado (distractor mixto)
  function withValue(r, type, v, c) {
    if (v < 0) return null;
    switch (type) {
      case 'add': { if (v > c.addMax) return null; const a = ri(r, 0, v); return B('+', N(a), N(v - a)); }
      case 'sub': { const room = Math.min(c.subMax - v, 9); if (room < 0) return null; const b = ri(r, 0, room); return B('-', N(v + b), N(b)); }
      case 'mul': {
        const fs = [];
        for (let a = 2; a <= 9; a++) if (v % a === 0 && v / a >= 2 && v / a <= 9) fs.push(a);
        if (!fs.length) return null;
        const a = pick(r, fs); return B('*', N(a), N(v / a));
      }
      case 'div': { if (v > 9) return null; const D = ri(r, 2, 9); return B('/', N(D * v), N(D)); }
      case 'combo': {
        const opts = [];
        for (let a = 2; a <= 6; a++) for (let b = 2; b <= 6; b++) {
          const m = a * b;
          if (v - m >= 1 && v - m <= 9) opts.push(['+', a, b, v - m]);
          if (m - v >= 1 && m - v <= 9) opts.push(['-', a, b, m - v]);
        }
        if (!opts.length) return null;
        const o = pick(r, opts); return B(o[0], B('*', N(o[1]), N(o[2])), N(o[3]));
      }
    }
    return null;
  }

  function createGenerator(diffKey, seed) {
    const c = DIFFS[diffKey];
    const r = mulberry32(seed >>> 0);
    let bag = [], n = 0;
    const recent = [];
    const WARM = { add: 1, sub: 1 };

    function lane() {
      if (!bag.length) {
        bag = [0, 0, 1, 1];
        for (let i = 3; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
      }
      return bag.pop();
    }
    function weightedType(w) {
      let tot = 0; for (const k in w) tot += w[k];
      let x = r() * tot;
      for (const k in w) { x -= w[k]; if (x < 0) return k; }
      return Object.keys(w)[0];
    }

    function next() {
      n++;
      const warm = n <= 2 && diffKey !== 'easy';   // calentamiento: 2 primeros sencillos
      const weights = warm ? WARM : c.weights;
      const types = Object.keys(weights);
      for (let attempt = 0; attempt < 300; attempt++) {
        const type = weightedType(weights);
        const correct = GEN[type](r, c);
        if (!exprValid(correct, c)) continue;
        const cs = formatExpr(correct);
        if (recent.includes(cs)) continue;
        const t = evalExpr(correct);
        let wrong = null;
        for (let k = 0; k < 40 && !wrong; k++) {
          let cand;
          if (types.length > 1 && r() < c.mixP) {
            cand = withValue(r, pick(r, types.filter((x) => x !== type)), t + pick(r, c.delta), c);
          } else {
            cand = perturb(r, correct, type, c);
          }
          if (cand && exprValid(cand, c) && evalExpr(cand) !== t && formatExpr(cand) !== cs) wrong = cand;
        }
        if (!wrong) continue;
        recent.push(cs); if (recent.length > 8) recent.shift();
        const ln = lane();
        const up = ln === 0 ? correct : wrong, lo = ln === 0 ? wrong : correct;
        return {
          id: n, target: t, type, correctLane: ln, difficulty: diffKey, seed,
          upper: { expr: up, text: formatExpr(up), value: evalExpr(up) },
          lower: { expr: lo, text: formatExpr(lo), value: evalExpr(lo) }
        };
      }
      throw new Error('generator exhausted');
    }
    return { next };
  }

  // ---------- Partida ----------
  function createGame(diffKey, seed) {
    const c = DIFFS[diffKey];
    const gen = createGenerator(diffKey, seed);
    const geo = mulberry32((seed ^ 0x9e3779b9) >>> 0);
    const L = c.lane, half = OBST.wall / 2;
    const cMin = OBST.hudBottom + L + half;
    const cMax = GROUND - OBST.groundPad - L - half;

    const s = {
      diff: diffKey, seed, status: 'countdown', countdown: 3, time: 0, score: 0, streak: 0, bestStreak: 0,
      speedMul: 1, scroll: 0, toNext: 0, cause: null, wrong: null, killer: null, dyingT: 0,
      bird: { y: 300, vy: 0, hoverY: 300, alive: true, flapT: 1 },
      obstacles: [], pending: null, events: [], lane: L
    };

    const laneCenter = (cc, ln) => (ln === 0 ? cc - half - L / 2 : cc + half + L / 2);
    const speed = () => PHYS.baseSpeed * s.speedMul;
    const spacingTime = () => Math.max(c.spacingMin, c.spacingStart - 0.12 * Math.floor(s.score / 5));

    function reachable(fromY, toY, dist) {
      const t = (dist - OBST.w - 2 * BIRD.hw) / (PHYS.baseSpeed * c.speedCap);
      if (t <= 0) return false;
      const dy = toY - fromY;
      if (dy < 0) return -dy <= REACH.climb * t - REACH.margin;           // subir
      const fall = Math.min(0.5 * PHYS.gravity * t * t, PHYS.maxFall * t);
      return dy <= fall - REACH.margin;                                     // bajar
    }

    function makePending(fromY, dist) {
      const ch = gen.next();
      let cc = null;
      for (let i = 0; i < 40; i++) {
        const cand = cMin + geo() * (cMax - cMin);
        if (reachable(fromY, laneCenter(cand, ch.correctLane), dist)) { cc = cand; break; }
      }
      if (cc === null) { // la opción más cercana posible
        const want = ch.correctLane === 0 ? fromY + half + L / 2 : fromY - half - L / 2;
        cc = Math.min(cMax, Math.max(cMin, want));
      }
      return { ch, c: Math.round(cc), dist };
    }

    s.pending = makePending(s.bird.y, W + 40 - BIRD.x + OBST.w + 2 * BIRD.hw);

    function spawn() {
      const p = s.pending;
      const o = { id: p.ch.id, x: W + 40 + s.toNext, c: p.c, ch: p.ch, resolved: false, chosen: null };
      s.obstacles.push(o);
      const dist = speed() * spacingTime();
      s.pending = makePending(laneCenter(o.c, o.ch.correctLane), dist);
      s.toNext += dist;
    }

    function die(cause, o) {
      s.status = 'dying'; s.cause = cause; s.killer = o || null; s.bird.alive = false; s.dyingT = 0;
      s.events.push(cause === 'wrong' ? 'wrong' : 'hit');
    }

    function current() {
      for (const o of s.obstacles) if (!o.resolved) return { ch: o.ch, c: o.c, obstacle: o };

    if (mode === 'game' && s) {
      by = s.bird.y; dead = !s.bird.alive;
      rot = s.status === 'countdown' ? 0 : Math.max(-0.4, Math.min(dead ? 1.2 : 0.7, s.bird.vy / 650));
      frame = s.bird.flapT < 0.08 ? 0 : s.bird.flapT < 0.16 ? 2 : (s.status === 'countdown' ? (Math.floor(time / 140) % 3) : 1);
    } else {
      by = 282 + Math.sin(time / 300) * 8; frame = Math.floor(time / 140) % 3;
    }
    const bx = mode === 'game' ? BIRD.x : W / 2;
    ctx.save(); ctx.translate(bx, by); ctx.rotate(rot);
    ctx.drawImage(dead ? OWL_DEAD : OWL_FRAMES[frame], -19 * 1.15, -14 * 1.15, 19 * 2.3, 14 * 2.3);
    ctx.restore();

    for (const f of floaters) {
      ctx.globalAlpha = Math.max(0, f.life); ctx.fillStyle = COL.pencil;
      ctx.font = '700 24px "Fredoka", "Arial Rounded MT Bold", sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = COL.ink; ctx.strokeText(f.text, f.x, f.y); ctx.fillText(f.text, f.x, f.y);
      ctx.globalAlpha = 1;
    }

    if (mode === 'game' && s) drawHud(s, time);
  }

  function drawHud(s, time) {
    // tablero de objetivo
    const cur = game.current();
    const pw = 224, ph = 94, px = (W - pw) / 2, py = 10;
    ctx.fillStyle = 'rgba(0,0,0,.3)'; roundRect(px + 2, py + 5, pw, ph, 6); ctx.fill();
    ctx.fillStyle = COL.paper; roundRect(px, py, pw, ph, 6); ctx.fill();
    ctx.fillStyle = COL.pencil; ctx.fillRect(px, py, pw, 5);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#5b6a64'; ctx.font = '600 10px "IBM Plex Sans", sans-serif';
    ctx.fillText(t('target').split('').join(' '), W / 2, py + 21);
    ctx.fillStyle = COL.ink; ctx.font = '700 40px "Fredoka", "Arial Rounded MT Bold", sans-serif';
    ctx.fillText(cur ? String(cur.ch.target) : '–', W / 2, py + 56);
    if (cur) {
      ctx.font = '700 14px "IBM Plex Mono", monospace'; ctx.fillStyle = '#2c3a35';
      ctx.fillText(`▲ ${cur.ch.upper.text}  ▼ ${cur.ch.lower.text}`, W / 2, py + 80);
    }
    // puntuación y racha
    ctx.textAlign = 'left'; ctx.font = '700 44px "Fredoka", "Arial Rounded MT Bold", sans-serif'; ctx.lineJoin = 'round';
    ctx.lineWidth = 6; ctx.strokeStyle = COL.ink; ctx.strokeText(String(s.score), 14, 52);
    ctx.fillStyle = COL.chalk; ctx.fillText(String(s.score), 14, 52);
    if (s.streak >= 2) {
      ctx.font = '700 14px "Fredoka", "Arial Rounded MT Bold", sans-serif'; ctx.lineWidth = 4; ctx.strokeStyle = COL.ink; ctx.strokeText(`${t('streak')} ×${s.streak}`, 15, 74);
      ctx.fillStyle = COL.pencil; ctx.fillText(`${t('streak')} ×${s.streak}`, 15, 74);
    }
    // cuenta atrás
    if (s.status === 'countdown') {
      const n = Math.ceil(s.countdown);
      ctx.textAlign = 'center'; ctx.font = '700 104px "Fredoka", "Arial Rounded MT Bold", sans-serif';
      ctx.fillStyle = 'rgba(20,42,37,.6)'; ctx.fillText(String(n), W / 2 + 4, 286);
      ctx.fillStyle = COL.chalk; ctx.fillText(String(n), W / 2, 282);
    }
    if (banner && banner.life > 0) {
      ctx.globalAlpha = Math.min(1, banner.life * 2); ctx.textAlign = 'center';
      ctx.font = '700 28px "Fredoka", "Arial Rounded MT Bold", sans-serif'; ctx.lineWidth = 6; ctx.strokeStyle = COL.ink; ctx.strokeText(banner.text, W / 2, 152); ctx.fillStyle = COL.pencil; ctx.fillText(banner.text, W / 2, 152);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- Bucle principal (paso fijo 60 Hz) ----------
  const DT = FM.PHYS.dt;
  let acc = 0, last = performance.now();
  function frame(now) {
    let d = (now - last) / 1000; last = now; if (d > 0.25) d = 0.25;
    if (mode === 'game' && game) {
      acc += d;
      while (acc >= DT) {
        const st = game.s.status;
        game.step(DT, st === 'playing' && flapQueued);
        if (st === 'playing' || st === 'countdown') flapQueued = false;
        onEvents(game.s.events);
        acc -= DT;
      }
      if (game.s.status === 'countdown') {
        const n = Math.ceil(game.s.countdown);
        if (n !== lastCount) { lastCount = n; Sound.play('tick'); }
      }
    } else {
      scrollIdle += 40 * d;
    }
    for (let i = particles.length - 1; i >= 0; i--) { const q = particles[i]; q.x += q.vx * d; q.y += q.vy * d; q.vy += 300 * d; q.life -= d * 1.6; if (q.life <= 0) particles.splice(i, 1); }
    for (let i = floaters.length - 1; i >= 0; i--) { const f = floaters[i]; f.y -= 40 * d; f.life -= d * 1.4; if (f.life <= 0) floaters.splice(i, 1); }
    if (banner) banner.life -= d;
    shake = Math.max(0, shake - 40 * d);
    render(now);
    requestAnimationFrame(frame);
  }

  function onEvents(evs) {
    for (const e of evs) {
      const s = game.s;
      switch (e) {
        case 'flap': Sound.play('flap'); break;
        case 'go': Sound.play('go'); lastCount = 4; break;
        case 'point':
          Sound.play('point'); vibrate(8);
          for (let i = 0; i < 12; i++) particles.push({ x: BIRD.x + 10, y: s.bird.y, vx: 40 + Math.random() * 120, vy: (Math.random() - 0.7) * 180, life: 1, sz: 2 + Math.random() * 3 });
          floaters.push({ x: BIRD.x + 30, y: s.bird.y - 24, text: '+1', life: 1 });
          break;
        case 'speedup': banner = { text: t('faster'), life: 1.2 }; break;
        case 'wrong': Sound.play('wrong'); vibrate([60, 40, 90]); shake = 8; break;
        case 'hit': Sound.play('hit'); vibrate(120); shake = 12; break;
        case 'over': setTimeout(showOver, 180); break;
      }
    }
  }

  // ---------- Pantallas ----------
  const $ = (id) => document.getElementById(id);
  const screens = ['menu', 'pause', 'over', 'settings'];
  function show(id) { screens.forEach((k) => { $(k).hidden = k !== id; }); $('pauseBtn').hidden = !(mode === 'game' && !id); }
  let settingsReturn = 'menu';

  function applyTexts() {
    document.documentElement.lang = prefs.lang;
    $('tHint').textContent = t('hint');
    [['dEasy', 'easy'], ['dNormal', 'normal'], ['dHard', 'hard']].forEach(([id, k]) => {
      const b = $(id); b.querySelector('span').textContent = t(k);
      b.querySelector('small').textContent = `${t('record')} ${store.stats.high[k]}`;
      b.setAttribute('aria-pressed', String(prefs.difficulty === k));
    });
    $('diffSeg').setAttribute('aria-label', 'Dificultad');
    $('playBtn').textContent = t('play'); $('settingsBtn').textContent = t('settings');
    $('tPaused').textContent = t('paused'); $('resumeBtn').textContent = t('resume');
    $('restartBtn').textContent = t('restart'); $('pauseMenuBtn').textContent = t('menu');
    $('tOver').textContent = t('over'); $('tScore').textContent = t('score'); $('tBest').textContent = t('best');
    $('retryBtn').textContent = t('retry'); $('overMenuBtn').textContent = t('menu'); $('newRecord').textContent = t('newRecord');
    $('tSettings').textContent = t('settings'); $('settingsBack').textContent = t('back');
    $('pauseBtn').setAttribute('aria-label', t('pause'));
    const tog = (id, label, on, val) => { const b = $(id); b.querySelector('span').textContent = label; b.querySelector('em').textContent = val || (on ? t('on') : t('off')); b.setAttribute('aria-pressed', String(!!on)); };
    tog('optSound', t('sound'), prefs.sound); tog('optMusic', t('music'), prefs.music);
    tog('optVibe', t('vibe'), prefs.vibration); tog('optLang', t('lang'), true, prefs.lang === 'es' ? 'ES' : 'EN');
  }

  function startGame() {
    Sound.ensure();
    const seed = (Math.random() * 2 ** 31) >>> 0;
    game = FM.createGame(prefs.difficulty, seed);
    mode = 'game'; acc = 0; lastCount = 4; flapQueued = false;
    particles.length = 0; floaters.length = 0; banner = null;
    show(null);
    Sound.startMusic();
  }
  function toMenu() { mode = 'menu'; game = null; applyTexts(); show('menu'); }
  function pauseGame() { if (game && game.pause()) { Sound.stopMusic(); show('pause'); } }
  function resumeGame() { if (game) { game.resume(); lastCount = 4; show(null); Sound.startMusic(); } }

  function showOver() {
    const s = game.s, st = store.stats;
    const prev = st.high[s.diff] || 0, isRecord = s.score > prev;
    if (isRecord) st.high[s.diff] = s.score;
    st.gamesPlayed++; st.correctAnswers += s.score; st.bestStreak = Math.max(st.bestStreak, s.bestStreak);
    save();
    $('finalScore').textContent = s.score; $('finalBest').textContent = st.high[s.diff];
    $('newRecord').hidden = !isRecord;
    $('causeText').innerHTML = s.cause === 'wrong' ? t('causeWrong')(s.wrong) : s.cause === 'ground' ? t('causeGround') : t('causeHit');
    $('seedText').textContent = `${t(s.diff)} · ${t('seed')} ${s.seed}`;
    Sound.stopMusic();
    if (isRecord && s.score > 0) Sound.play('record');
    show('over');
    setTimeout(() => $('retryBtn').focus({ preventScroll: true }), 50);
  }

  // ---------- Entrada ----------
  function flap() { Sound.ensure(); if (mode === 'game' && game) flapQueued = true; }
  stage.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    if (mode === 'game' && !screens.some((k) => !$(k).hidden)) { e.preventDefault(); flap(); }
  });
  window.addEventListener('keydown', (e) => {
    const k = e.code;
    if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW') {
      if (mode === 'game' && game && game.s.status === 'over' && !$('over').hidden) { e.preventDefault(); startGame(); return; }
      if (mode === 'menu' && !$('menu').hidden && document.activeElement === document.body) { e.preventDefault(); startGame(); return; }
      if (mode === 'game' && $('pause').hidden && $('over').hidden) { e.preventDefault(); flap(); }
    } else if (k === 'Escape' || k === 'KeyP') {
      if (mode === 'game' && game) { if (game.s.status === 'paused') resumeGame(); else pauseGame(); }
    }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
  window.addEventListener('blur', () => pauseGame());

  const click = (id, fn) => $(id).addEventListener('click', (e) => { Sound.ensure(); Sound.play('click'); fn(e); });
  ['dEasy', 'dNormal', 'dHard'].forEach((id) => click(id, () => { prefs.difficulty = $(id).dataset.d; save(); applyTexts(); }));
  click('playBtn', startGame);
  click('settingsBtn', () => { settingsReturn = 'menu'; show('settings'); });
  click('pauseBtn', pauseGame);
  click('resumeBtn', resumeGame);
  click('restartBtn', startGame);
  click('pauseMenuBtn', toMenu);
  click('retryBtn', startGame);
  click('overMenuBtn', toMenu);
  click('settingsBack', () => { show(settingsReturn); });
  click('optSound', () => { prefs.sound = !prefs.sound; save(); applyTexts(); });
  click('optMusic', () => { prefs.music = !prefs.music; save(); applyTexts(); if (prefs.music && mode === 'menu') Sound.startMusic(); if (!prefs.music) Sound.stopMusic(); });
  click('optVibe', () => { prefs.vibration = !prefs.vibration; save(); applyTexts(); vibrate(20); });
  click('optLang', () => { prefs.lang = prefs.lang === 'es' ? 'en' : 'es'; save(); applyTexts(); });

  // Ecuación animada del logo
  const g0 = FM.createGenerator('normal', 3);
  setInterval(() => { if (mode === 'menu') { const ch = g0.next(); $('logoEq').textContent = `${ch.correctLane === 0 ? ch.upper.text : ch.lower.text} = ${ch.target}`; } }, 2200);

  applyTexts(); show('menu');
  const fontsReady = document.fonts ? Promise.race([
    Promise.all(['700 20px "Pixelify Sans"', '700 20px "IBM Plex Mono"', '500 16px "IBM Plex Mono"', '600 10px "IBM Plex Sans"', '700 40px "Fredoka"'].map((f) => document.fonts.load(f))),
    new Promise((r) => setTimeout(r, 1500))
  ]) : Promise.resolve();
  fontsReady.then(redrawScribbles).catch(() => {});
  requestAnimationFrame((n) => { last = n; requestAnimationFrame(frame); });
})();
</script>
